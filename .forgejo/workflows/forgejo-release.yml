name: Create Forgejo Release

# Forgejo is canonical; GitHub (SkillWeave-AI/skillweave-sdk) is the public
# mirror. This workflow does not write a release object itself: it gates the
# release title and the release notes, then hands publication to the ops-engine
# ReleaseHandler, which creates the release on EVERY destination committed in
# .ops.yaml and reports a partial publication instead of swallowing it.
#
# The four things this workflow refuses to do, each answered below:
#   bare-tag title   -> the title gate, before any release object exists
#   commit dump      -> the body is the CHANGELOG section for the tag
#   one forge only   -> destinations come from .ops.yaml, both are published
#   implicit CI input -> the pinned engine ref and the two secrets are the only
#                       CI inputs; no repository variable is read anywhere
#
# No assets are attached. This repository is consumed from published source by
# tag; it builds no distribution artifact here, so release-assets stays empty and
# the engine attaches nothing rather than failing on a missing path.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to create release for (e.g. v0.3.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      # The release title is a gate, not an agreement. It must conform to the
      # pattern declared in .version.yaml — not a hardcoded product name. A tag
      # whose rendered title does not conform is refused here, before any
      # release object exists on either forge. The forge default names a release
      # after the bare tag; that is not the convention.
      - name: Gate the release title
        id: title
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
        run: |
          set -euo pipefail

          python3 - "${TAG_NAME}" <<'TITLE_GATE_PY'
          import os
          import re
          import sys
          from pathlib import Path

          yaml_path = Path(".version.yaml")
          if not yaml_path.exists():
              sys.stderr.write(
                  "ReleaseTitlePolicyError: .version.yaml not found\n"
              )
              sys.exit(2)

          text = yaml_path.read_text("utf-8")

          m = re.search(r"^product_name:\s*(.+)$", text, re.MULTILINE)
          product_name = m.group(1).strip().strip("\"'") if m else ""
          if not product_name:
              sys.stderr.write(
                  "ReleaseTitlePolicyError: product_name not found or empty "
                  "in .version.yaml\n"
              )
              sys.exit(2)

          m = re.search(r"^pattern:\s*(.+)$", text, re.MULTILINE)
          pattern_raw = m.group(1).strip() if m else ""
          if (
              len(pattern_raw) >= 2
              and pattern_raw[0] == pattern_raw[-1]
              and pattern_raw[0] in ("'", '"')
          ):
              pattern_raw = pattern_raw[1:-1]
          if not pattern_raw:
              sys.stderr.write(
                  "ReleaseTitlePolicyError: pattern not found or empty "
                  "in .version.yaml\n"
              )
              sys.exit(2)

          full_pattern = pattern_raw.replace("{product}", product_name)
          try:
              NAME_RE = re.compile(full_pattern)
          except re.error as exc:
              sys.stderr.write(
                  "ReleaseTitlePolicyError: invalid regex %r: %s\n"
                  % (full_pattern, exc)
              )
              sys.exit(2)

          tag_name = sys.argv[1]
          release_name = "%s %s" % (product_name, tag_name)

          if not NAME_RE.match(release_name):
              sys.stderr.write(
                  "ReleaseTitleError: release name %r does not match the "
                  "required convention %r. Refusing before any release "
                  "object exists on either forge.\n"
                  % (release_name, full_pattern)
              )
              sys.exit(2)

          sys.stdout.write("title gate: %r conforms\n" % release_name)

          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a") as fh:
                  fh.write("release_name=%s\n" % release_name)
                  fh.write("product_name=%s\n" % product_name)
          TITLE_GATE_PY

      # The release body is the CHANGELOG entry for this version, never commit
      # subjects. A tag whose version has no section fails here, before any
      # release object exists — a release with no authored notes is a release
      # nobody can read.
      #
      # The extractor is a byte-for-byte copy of the one in ops-engine v3.4.2's
      # own release workflow, and it is stdlib-only on purpose: importing
      # ops_engine at this point would pull yaml and pydantic, which the bare
      # runner image does not carry. The heading pattern accepts every form
      # CHANGELOG.md uses: `## v0.3.0 (2026-10-11)`, `## v0.3.0 — ...`, and the
      # bracketed `## [0.3.0] — ...`.
      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
        run: |
          set -euo pipefail

          NOTES="$(python3 - "$TAG_NAME" <<'PY'
          import re
          import sys

          HEADER_PATTERN = re.compile(
              r"^##\s+"
              r"(?:\[)?(?:[\w-]+\s+)?v?"
              r"(\d+\.\d+\.\d+(?:[-.\w]*)?)"
              r"(?:\])?"
              r".*$",
              re.MULTILINE,
          )

          tag = sys.argv[1]
          version = tag.lstrip("v")
          with open("CHANGELOG.md", encoding="utf-8") as fh:
              content = fh.read()
          matches = list(HEADER_PATTERN.finditer(content))
          target_match = None
          target_idx = -1
          for idx, m in enumerate(matches):
              if m.group(1) == version:
                  target_match = m
                  target_idx = idx
                  break
          if target_match is None:
              notes = ""
          else:
              start = target_match.end()
              if target_idx + 1 < len(matches):
                  end = matches[target_idx + 1].start()
              else:
                  end = len(content)
              notes = content[start:end].strip()
          if not notes:
              sys.stderr.write(
                  "MissingChangelogEntryError: no '## %s' section in CHANGELOG.md; "
                  "a release with no notes would post commit subjects, so the "
                  "release is refused.\n" % version
              )
              sys.exit(2)
          sys.stdout.write(notes)
          PY
          )"

          {
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Generic tooling lives in the open base. ops-engine is OSS and publicly
      # mirrored, so this needs no credential — the same fetch a version gate
      # uses elsewhere.
      #
      # Pinned to the v3.4.2 tag, the one ref this workflow installs from. An
      # earlier revision pinned a commit because a mirror tag once pointed behind
      # the canonical one and delivered the wrong code; ops-engine closed that at
      # its source, and the tag is a fixed point again, so the pin follows it.
      - name: Fetch the audience gate (canonical, ops-engine)
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/LangeVC/ops-engine/v3.4.2/scripts/release_notes_audience_gate.py" \
            -o "$RUNNER_TEMP/release_notes_audience_gate.py"

          # Prove what arrived. Without this the step reports success even when
          # it fetched an HTML page: a redirect to a login page returns 200 and
          # curl -f never triggers, so the failure surfaces later as a
          # SyntaxError on "<!DOCTYPE html>".
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" \
            "$RUNNER_TEMP/release_notes_audience_gate.py" \
            || { echo "fetched file is not Python — first three lines:"; \
                 head -3 "$RUNNER_TEMP/release_notes_audience_gate.py"; exit 1; }

      # The release body is addressed at an external reader. A section that still
      # names an internal ticket addresses the tracker that produced the release,
      # not the consumer the body is for.
      #
      # The engine classifies nothing by shape: the code-and-number form is
      # shared by internal ticket ids and by identifiers a reader legitimately
      # needs (CVE, RFC, ISO, PEP-8, UTF-8, SHA-256, TLS-1.3). It refuses a
      # ticket-shaped token only when its prefix appears in the vocabulary THIS
      # repository declares via `tracker_prefixes:` in .ops.yaml. An absent list
      # means no ticket check — the correct default, not a hole.
      - name: Gate the release notes for an external audience
        env:
          NOTES: "${{ steps.notes.outputs.notes }}"
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          PREFIXES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE" "$PREFIXES_FILE"' EXIT
          printf '%s\n' "$NOTES" > "$NOTES_FILE"
          python3 - "$PREFIXES_FILE" <<'PREFIXES_PY'
          import sys
          from pathlib import Path

          out = sys.argv[1]
          prefixes = []
          ops = Path(".ops.yaml")
          if ops.exists():
              for raw in ops.read_text(encoding="utf-8").splitlines():
                  line = raw.split("#", 1)[0].strip()
                  if not line.startswith("tracker_prefixes:"):
                      continue
                  value = line[len("tracker_prefixes:"):].strip()
                  if value.startswith("[") and value.endswith("]"):
                      value = value[1:-1]
                  for item in value.split(","):
                      item = item.strip().strip("'\"")
                      if item:
                          prefixes.append(item)
          Path(out).write_text("\n".join(prefixes) + ("\n" if prefixes else ""),
                               encoding="utf-8")
          PREFIXES_PY
          python3 "$RUNNER_TEMP/release_notes_audience_gate.py" \
            --ticket-prefixes "$PREFIXES_FILE" \
            "$NOTES_FILE"

      # The workflow calls the engine to publish; it does not reimplement
      # publication. ReleaseHandler.publish_release creates the release on EVERY
      # destination resolved from the committed .ops.yaml and reports a partial
      # publication rather than swallowing it.
      #
      # Two forges carry two credentials, so the adapter factory is given one
      # credential per forge value. A destination whose forge has no credential
      # is a named refusal, never a silent unauthenticated publication. The
      # webhook secret is empty on both: publication never parses a webhook.
      #
      # No assets are attached: release-assets is created and left empty so the
      # engine attaches nothing, rather than failing on a missing path.
      - name: Publish the release to every destination
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
          NOTES: "${{ steps.notes.outputs.notes }}"
          NAME_TEMPLATE: "${{ steps.title.outputs.product_name }} {tag_name}"
          FORGEJO_REPOSITORY: "${{ github.repository }}"
          FORGEJO_BASE_URL: "${{ github.server_url }}"
          FORGEJO_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GH_MIRROR_TOKEN: "${{ secrets.GH_MIRROR_TOKEN }}"
        run: |
          set -euo pipefail

          mkdir -p release-assets

          # The engine installs into an isolated venv outside the source tree:
          # the runner's system interpreter is PEP 668 externally managed, and an
          # in-tree venv would become part of anything this repository packages.
          # v3.4.2 is the single pinned ref this workflow installs from.
          ENGINE_VENV="$(mktemp -d)/engine-venv"
          python3 -m venv "$ENGINE_VENV"
          "$ENGINE_VENV/bin/python" -m pip install --quiet \
            "git+https://github.com/LangeVC/ops-engine@v3.4.2"

          # Prove what was installed. A silently older engine is the failure
          # mode this whole step exists to remove.
          "$ENGINE_VENV/bin/python" - <<'VERSION_GATE_PY'
          import importlib.metadata as md
          import sys

          REQUIRED = "3.4.2"
          got = md.version("ops-engine")
          if got != REQUIRED:
              sys.stderr.write(
                  "EngineVersionError: installed ops-engine %s, required %s. "
                  "Refusing to publish with an engine other than the pinned one.\n"
                  % (got, REQUIRED)
              )
              sys.exit(2)
          from ops_engine.adapters.factory import Credential  # noqa: F401
          sys.stdout.write("engine: ops-engine %s, per-destination Credential present\n" % got)
          VERSION_GATE_PY

          "$ENGINE_VENV/bin/python" - <<'PUBLISH_PY'
          import asyncio
          import os
          import sys

          from ops_engine.adapters.factory import Credential, adapters_for
          from ops_engine.config_loader import (
              OpsEngineConfig,
              OpsYamlError,
              load_ops_yaml,
          )
          from ops_engine.modules.release import ReleaseHandler

          # Destinations come from the committed .ops.yaml at the repository
          # root. A missing or empty file is a named refusal, never a silently
          # narrowed release: "no destinations" resolving to a Forgejo-only
          # publication that reports success is exactly what must not ship.
          try:
              layer3 = load_ops_yaml(".")
          except OpsYamlError as exc:
              print(f"::error::OpsYamlError: {exc}", file=sys.stderr)
              sys.exit(2)

          if layer3 is None:
              print(
                  "::error::MissingOpsYamlError: no .ops.yaml at the repository "
                  "root; the release destination is a committed file, not a CI "
                  "variable. Refusing to publish with no declared destinations.",
                  file=sys.stderr,
              )
              sys.exit(2)

          destinations = layer3.destinations
          if not destinations:
              print(
                  "::error::MissingReleaseDestinationsError: .ops.yaml declares "
                  "no destinations; refusing to publish to zero forges rather "
                  "than silently narrowing the release.",
                  file=sys.stderr,
              )
              sys.exit(2)

          repo = os.environ["FORGEJO_REPOSITORY"]
          tag_name = os.environ["TAG_NAME"]
          release_notes = os.environ["NOTES"]
          name_template = os.environ["NAME_TEMPLATE"]
          forgejo_base_url = os.environ["FORGEJO_BASE_URL"]

          # Materialise the Layer-3 destinations into a typed Layer-2 config so
          # that publish_release's internal resolve_destinations re-resolves the
          # same list.
          org, _, repo_name = repo.partition("/")
          config = OpsEngineConfig.load(
              {
                  "orgs": {
                      org: {
                          "repositories": {
                              repo_name: {
                                  "destinations": [
                                      {
                                          "forge": d.forge,
                                          "repo": d.repo,
                                          "role": d.role,
                                          "visibility": d.visibility,
                                      }
                                      for d in destinations
                                  ]
                              }
                          }
                      }
                  }
              }
          )

          credentials = {
              "forgejo": Credential(token=os.environ["FORGEJO_TOKEN"]),
              "github": Credential(token=os.environ["GH_MIRROR_TOKEN"]),
          }
          adapters = adapters_for(
              destinations,
              credentials=credentials,
              base_url=forgejo_base_url,
          )

          async def main():
              report = await ReleaseHandler.publish_release(
                  config,
                  repo,
                  tag_name,
                  release_notes,
                  "release-assets",
                  name_template=name_template,
                  adapters=adapters,
              )

              published = ", ".join(report.published) or "(none)"
              failed = ", ".join(report.failed) or "(none)"
              print(f"published destinations: {published}")
              print(f"failed destinations:    {failed}")
              if report.failed:
                  # A partial publication is a reported failure, never a silent
                  # success: the run goes red so the operator sees the drift.
                  print(
                      "::error::PartialPublicationError: the release was not "
                      "published to every destination; failed: " + failed
                  )
                  sys.exit(1)

          asyncio.run(main())
          PUBLISH_PY
