name: Mirror to GitHub

# Forgejo is canonical; GitHub (SkillWeave-AI/skillweave-sdk) is the public
# read-only mirror. Force-push exactly the ref that triggered the run.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref zum Nachspiegeln (z.B. refs/tags/v1.0.0)'
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependency check — pinned ops-engine must be importable
        run: |
          set -euo pipefail
          python3 - <<'DEP_PY'
          import importlib.metadata as md, sys
          REQUIRED = "3.4.2"
          try:
              got = md.version("ops-engine")
          except md.PackageNotFoundError:
              print("::error::ops-engine is NOT INSTALLED. "
                    "The preflight guard requires ops-engine v{} which is "
                    "a shared-engine dependency outside this workflow. "
                    "Install it in the runner image or via CI setup.".format(REQUIRED), file=sys.stderr)
              sys.exit(1)
          if got != REQUIRED:
              print("::error::ops-engine version mismatch: installed {}, required {}. "
                    "The preflight guard requires exactly the pinned version.".format(got, REQUIRED), file=sys.stderr)
              sys.exit(1)
          from ops_engine.modules.mirror import MirrorHandler, MirrorDestinationError
          print("dependency check: ops-engine {} OK, MirrorHandler importable".format(got))
          DEP_PY


      - name: Preflight — prove destination before any push
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GH_REPO: "SkillWeave-AI/skillweave-sdk"
          GH_EXPECTED_VISIBILITY: "public"
          GH_EXPECTED_REPOSITORY_ID: "1331291180"
        run: |
          set -euo pipefail
          python3 - "${GH_REPO}" "${GH_MIRROR_TOKEN:-}" "${GH_EXPECTED_VISIBILITY:-}" "${GH_EXPECTED_REPOSITORY_ID:-}" <<'PROVE_PY'
          import asyncio, os, sys
          from ops_engine.modules.mirror import MirrorHandler, MirrorDestinationError

          async def main():
              destination = sys.argv[1]
              token = sys.argv[2] if sys.argv[2] else None
              visibility = sys.argv[3] if sys.argv[3] else None
              repo_id_str = sys.argv[4]
              repo_id = int(repo_id_str) if repo_id_str else None
              try:
                  await MirrorHandler.prove_destination(
                      destination, token=token,
                      expected_visibility=visibility,
                      expected_repository_id=repo_id,
                  )
              except MirrorDestinationError as exc:
                  print(f"::error::preflight: {exc}", file=sys.stderr)
                  sys.exit(1)
          asyncio.run(main())
          PROVE_PY
          echo "preflight: ${GH_REPO} verified."
      - name: Push to GitHub mirror
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          MIRROR_REF: ${{ inputs.ref || github.ref }}
        run: |
          remote="https://x-access-token:${GH_MIRROR_TOKEN}@github.com/SkillWeave-AI/skillweave-sdk.git"
          git push --force "$remote" "+${MIRROR_REF}:${MIRROR_REF}"
