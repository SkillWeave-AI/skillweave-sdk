name: Mirror to GitHub

# Forgejo is canonical; GitHub (SkillWeave-AI/skillweave-sdk) is the public
# read-only mirror. Force-push exactly the ref that triggered the run.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref zum Nachspiegeln (z.B. refs/tags/v1.0.0)'
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependency check — operator-issued immutable engine with required ABI
        run: |
          set -euo pipefail
          python3 - <<'DEP_PY'
          import importlib.metadata as md, sys, inspect
          from ops_engine.modules.mirror import MirrorHandler, MirrorDestinationError

          # The operator issues the immutable engine artifact externally.  This
          # step only verifies the installed engine has the required ABI before
          # any preflight or push.  The engine is NOT installed by this workflow
          # — it is a shared-engine dependency of the runner image.  The pending
          # shared-engine integration/publication is tracked in docs/mirror-migration.md.
          try:
              got = md.version("ops-engine")
          except md.PackageNotFoundError:
              print("::error::ops-engine is NOT INSTALLED. "
                    "The preflight guard requires an operator-issued ops-engine "
                    "installed in the runner image or via CI setup. "
                    "See docs/mirror-migration.md for the shared-engine requirement.",
                    file=sys.stderr)
              sys.exit(1)

          # Verify the exact identity ABI that the old published artifact lacks.
          sig = inspect.signature(MirrorHandler.prove_destination)
          for kw in ("expected_visibility", "expected_repository_id"):
              if kw not in sig.parameters:
                  print("::error::ops-engine {} MirrorHandler.prove_destination "
                        "lacks required kwarg {!r}. "
                        "The installed engine is the old published artifact which "
                        "does not support exact identity checks. "
                        "Install the operator-issued immutable engine with the "
                        "required ABI. "
                        "See docs/mirror-migration.md.".format(got, kw),
                        file=sys.stderr)
                  sys.exit(1)

          print("dependency check: ops-engine {} OK, prove_destination accepts "
                "expected_visibility and expected_repository_id".format(got))
          DEP_PY


      - name: Preflight — prove destination before any push
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GH_REPO: "SkillWeave-AI/skillweave-sdk"
          GH_EXPECTED_VISIBILITY: "public"
          GH_EXPECTED_REPOSITORY_ID: "1331291180"
        run: |
          set -euo pipefail
          python3 - "${GH_REPO}" "${GH_MIRROR_TOKEN:-}" "${GH_EXPECTED_VISIBILITY:-}" "${GH_EXPECTED_REPOSITORY_ID:-}" <<'PROVE_PY'
          import asyncio, os, sys
          from ops_engine.modules.mirror import MirrorHandler, MirrorDestinationError

          async def main():
              destination = sys.argv[1]
              token = sys.argv[2] if sys.argv[2] else None
              visibility = sys.argv[3] if sys.argv[3] else None
              repo_id_str = sys.argv[4]
              repo_id = int(repo_id_str) if repo_id_str else None
              try:
                  await MirrorHandler.prove_destination(
                      destination, token=token,
                      expected_visibility=visibility,
                      expected_repository_id=repo_id,
                  )
              except MirrorDestinationError as exc:
                  print(f"::error::preflight: {exc}", file=sys.stderr)
                  sys.exit(1)
          asyncio.run(main())
          PROVE_PY
          echo "preflight: ${GH_REPO} verified."
      - name: Push to GitHub mirror
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          MIRROR_REF: ${{ inputs.ref || github.ref }}
        run: |
          remote="https://x-access-token:${GH_MIRROR_TOKEN}@github.com/SkillWeave-AI/skillweave-sdk.git"
          git push --force "$remote" "+${MIRROR_REF}:${MIRROR_REF}"
